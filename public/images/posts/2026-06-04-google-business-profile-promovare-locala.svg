<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Google Business Profile și promovare locală</title>
  <desc id="desc">Ilustrație editorială cu fundal întunecat, panouri geometrice și mesaj despre promovarea locală de 100 EUR.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="112" r="56" fill="#38bdf8" fill-opacity="0.18"/>
  <circle cx="1048" cy="206" r="24" fill="#22c55e" fill-opacity="0.22"/>
  <circle cx="892" cy="432" r="66" fill="#f59e0b" fill-opacity="0.16"/>
  <circle cx="198" cy="430" r="28" fill="#38bdf8" fill-opacity="0.16"/>
  <rect x="70" y="70" width="1060" height="490" rx="30" fill="url(#panel)" stroke="#475569" stroke-opacity="0.5" filter="url(#shadow)"/>
  <rect x="110" y="120" width="340" height="220" rx="26" fill="#0ea5e9" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.2"/>
  <rect x="500" y="150" width="560" height="170" rx="26" fill="#22c55e" fill-opacity="0.10" stroke="#86efac" stroke-opacity="0.18"/>
  <rect x="590" y="340" width="430" height="120" rx="26" fill="#f59e0b" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.18"/>
  <text x="110" y="168" fill="#ffffff" font-size="54" font-family="Arial, Helvetica, sans-serif" font-weight="700">Google Business Profile</text>
  <text x="110" y="227" fill="#e2e8f0" font-size="30" font-family="Arial, Helvetica, sans-serif">Promovare locală 100 EUR</text>
  <text x="110" y="274" fill="#cbd5e1" font-size="26" font-family="Arial, Helvetica, sans-serif">Vizibilitate în hartă, apeluri și cereri de ofertă</text>
  <text x="110" y="369" fill="#7dd3fc" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700">Departamentul de Marketing</text>
  <text x="110" y="416" fill="#e2e8f0" font-size="24" font-family="Arial, Helvetica, sans-serif">Abonament clar pentru afaceri locale</text>
  <rect x="110" y="470" width="400" height="50" rx="18" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.36"/>
  <text x="132" y="503" fill="#a5f3fc" font-size="22" font-family="Arial, Helvetica, sans-serif">SEO local + AEO pentru orașe din România</text>
</svg>
